name: Versioned release

# Push a tag like v2.1.1 (matching the version in app/pubspec.yaml) to build
# a Shorebird release APK, signed with the permanent key, and publish it as a
# GitHub release. Later Dart-only fixes for that version ship with patch.yml
# instead of a new APK. If the tag's message contains "beta"
# (git tag -a v2.4.0 -m "v2.4.0 beta"), the release is a pre-release and
# does not become Latest (so the app's "latest version" hint ignores it).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pubspec version
        run: |
          VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: ./.github/actions/android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # `shorebird flutter` doesn't proxy these; the build itself runs
      # through Shorebird's own Flutter 3.47.4 below.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: shorebird release android --artifact apk --flutter-version=3.47.4

      - uses: ./.github/actions/verify-apk-signature
        with:
          apk: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "hilton-meters-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          # actions/checkout turns the tag into a lightweight one; fetch the
          # annotated tag to read its message. Release notes stay the commit
          # message, as before.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_MESSAGE="$(git tag -l --format='%(contents)' "$TAG")"
          NOTES="$(git log -1 --format=%B)"
          if echo "$TAG_MESSAGE" | grep -qi beta; then
            KIND=(--prerelease --latest=false)
            TITLE="$TAG (beta)"
          else
            KIND=(--latest)
            TITLE="$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "hilton-meters-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "hilton-meters-${TAG}.apk" --title "$TITLE" "${KIND[@]}" --notes "${NOTES:-Release $TAG}"
          fi
