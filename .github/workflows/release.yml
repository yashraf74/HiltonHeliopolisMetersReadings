name: Versioned release

# Push a tag like v2.0.0 to build the APK on GitHub and publish it as a
# full (non-prerelease) release named after the tag. The rolling "latest"
# release keeps being updated by android-apk.yml on every push to main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "hilton-meters-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "hilton-meters-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "hilton-meters-${TAG}.apk" --title "$TAG" --latest --notes "${NOTES:-Release $TAG}"
          fi
