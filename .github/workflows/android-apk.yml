name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "hilton-meters-${{ github.run_number }}.apk"

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="Build #${{ github.run_number }} from ${GITHUB_SHA::7} — $(git log -1 --pretty=%s)"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$NOTES" --target "$GITHUB_SHA"
            for asset in $(gh release view latest --json assets -q '.assets[].name'); do
              gh release delete-asset latest "$asset" -y
            done
          else
            gh release create latest --title "Latest Android build" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload latest "hilton-meters-${{ github.run_number }}.apk" --clobber
