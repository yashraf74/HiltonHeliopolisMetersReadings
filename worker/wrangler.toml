name = "hilton-heliopolis-meters-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# worker-mailer (export emails over SMTP) needs the Node.js compatibility layer.
compatibility_flags = ["nodejs_compat"]

# Gmail account export emails are sent from. Its app password is the
# GMAIL_APP_PASSWORD secret (`npx wrangler secret put GMAIL_APP_PASSWORD`).
[vars]
GMAIL_USER = ""

[[d1_databases]]
binding = "DB"
database_name = "hilton-heliopolis-meters-db"
database_id = "ddfd41e9-dd91-44f7-be2b-3135b3c1e3b8"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "hilton-heliopolis-meter-photos"

# Friday 10:00 UTC = 12:00/13:00 Cairo: purge reading photos older than 90 days.
[triggers]
crons = ["0 10 * * 5"]

[[kv_namespaces]]
binding = "SETTINGS"
id = "2e5c7756eb6a4d27af36d35a1b464556"
